<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniPACS</title><link rel="stylesheet" href="/static/site.css"></head>
<body data-csrf="{{ csrf_token }}">
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5.5" rx="6.5" ry="2.5"/><path d="M5.5 5.5v6c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-6M5.5 11.5v6C5.5 18.9 8.4 20 12 20s6.5-1.1 6.5-2.5v-6"/></svg></span>
      <div><h1>MiniPACS</h1><p>Estudos DICOM temporários</p></div>
    </div>
    <form id="logout" method="post" action="/logout?csrf={{ csrf_token }}"><button class="secondary logout-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0"/></svg>Sair ({{ username }})</button></form>
  </div>
</header>
<main>
  <section class="summary" aria-label="Resumo">
    <article class="stat-card"><span class="stat-icon studies-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5M10 13h5M10 17h5"/></svg></span><div><span>Estudos</span><strong id="count-studies">—</strong></div></article>
    <article class="stat-card"><span class="stat-icon images-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg></span><div><span>Imagens</span><strong id="count-images">—</strong></div></article>
    <article class="stat-card"><span class="stat-icon storage-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v7c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5M5 12v7c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-7"/></svg></span><div><span>Espaço ocupado</span><strong id="count-bytes">—</strong></div></article>
  </section>
  <section class="controls" aria-label="Busca e ações em lote">
    <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Buscar por nome, ID, descrição, accession ou data" aria-label="Buscar estudos"></label>
    <div class="control-actions"><label class="select-all"><input id="select-all" type="checkbox"> <span>Selecionar todos</span></label><div class="batch-actions"><button id="bulk-download" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>Baixar selecionados</button><button id="bulk-delete" class="danger" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v5m4-5v5M9 7l1-3h4l1 3m-9 0 1 13h10l1-13"/></svg>Excluir selecionados</button></div></div>
  </section>
  <section class="table-wrap"><table><thead><tr><th></th><th>Nome</th><th>Data</th><th>Descrição</th><th>Destino AE</th><th>Imagens</th><th>Recebido</th><th>Ações</th></tr></thead><tbody id="studies"><tr><td colspan="8">Carregando estudos…</td></tr></tbody></table></section>
</main>
<div id="bulk-download-queue" class="queue-overlay" role="dialog" aria-modal="true" aria-labelledby="queue-title" hidden>
  <section class="queue-panel">
    <div class="queue-heading"><div><h2 id="queue-title">Preparando downloads</h2><p id="queue-message">Os estudos serão compactados um por vez.</p></div><span id="queue-count" class="queue-count">0 de 0</span></div>
    <div class="queue-progress" aria-hidden="true"><span id="queue-progress-bar"></span></div>
    <ol id="queue-list" class="queue-list" aria-label="Estudos selecionados"></ol>
    <div class="queue-actions"><button id="queue-cancel" class="secondary" type="button">Cancelar após o atual</button></div>
  </section>
</div>
<div id="download-progress" class="download-progress" role="status" aria-live="polite" aria-hidden="true"><span class="spinner" aria-hidden="true"></span><span>Compactando arquivos…</span></div>
<dialog id="confirm"><form method="dialog"><h2>Confirmar exclusão</h2><p id="confirm-text"></p><div><button value="cancel" class="secondary">Cancelar</button><button id="confirm-delete" value="confirm" class="danger">Excluir</button></div></form></dialog>
<script src="/static/app.js"></script>
</body>
</html>
