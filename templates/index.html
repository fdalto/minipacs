<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniPACS</title><link rel="stylesheet" href="/static/site.css"></head>
<body data-csrf="{{ csrf_token }}"><header><div><h1>MiniPACS</h1><p>Estudos DICOM temporários</p></div><form id="logout" method="post" action="/logout?csrf={{ csrf_token }}"><button class="secondary">Sair ({{ username }})</button></form></header>
<main><section class="summary" aria-label="Resumo"><article><span>Estudos</span><strong id="count-studies">—</strong></article><article><span>Imagens</span><strong id="count-images">—</strong></article><article><span>Espaço ocupado</span><strong id="count-bytes">—</strong></article></section>
<section class="controls"><input id="search" type="search" placeholder="Buscar por nome, ID, descrição, accession ou data" aria-label="Buscar estudos"><div><label><input id="select-all" type="checkbox"> Selecionar todos</label><button id="bulk-download" disabled>Baixar selecionados</button><button id="bulk-delete" class="danger" disabled>Excluir selecionados</button></div></section>
<section class="table-wrap"><table><thead><tr><th></th><th>Nome</th><th>Data</th><th>Descrição</th><th>Destino AE</th><th>Imagens</th><th>Recebido</th><th>Ações</th></tr></thead><tbody id="studies"><tr><td colspan="8">Carregando estudos…</td></tr></tbody></table></section></main>
<div id="download-progress" class="download-progress" role="status" aria-live="polite" aria-hidden="true"><span class="spinner" aria-hidden="true"></span><span>Compactando arquivos…</span></div>
<dialog id="confirm"><form method="dialog"><h2>Confirmar exclusão</h2><p id="confirm-text"></p><div><button value="cancel" class="secondary">Cancelar</button><button id="confirm-delete" value="confirm" class="danger">Excluir</button></div></form></dialog><script src="/static/app.js"></script></body></html>
